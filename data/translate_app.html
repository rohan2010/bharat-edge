<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Translation workbench</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%233a49c4'/%3E%3Ctext x='16' y='23' font-size='19' text-anchor='middle' fill='white' font-family='serif'%3E%E0%A4%85%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;500;600&family=Tiro+Devanagari+Hindi:ital@0;1&display=swap" rel="stylesheet">
<style>
:root {
  --paper: #f4f6f8;
  --surface: #ffffff;
  --rail: #eaeef3;
  --ink: #1d2433;
  --muted: #5d667a;
  --faint: #c9d0db;
  --line: #dde2ea;
  --neel: #3a49c4;
  --neel-soft: #e3e6fa;
  --done: #2e7a58;
  --problem: #a86a12;
  --problem-soft: #fbf0dc;
  --focus: #3a49c4;
  --read: "Tiro Devanagari Hindi", "Kohinoor Devanagari", "Noto Serif Devanagari", Georgia, serif;
  --ui: "Mukta", "Kohinoor Devanagari", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --paper: #121621;
    --surface: #191e2b;
    --rail: #0e121b;
    --ink: #e4e8f1;
    --muted: #9aa3b8;
    --faint: #3a4256;
    --line: #2a3142;
    --neel: #8f9cff;
    --neel-soft: #252b4a;
    --done: #5cc496;
    --problem: #e6a548;
    --problem-soft: #3a2e17;
    --focus: #8f9cff;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font: 400 16px/1.5 var(--ui);
  display: grid;
  grid-template-columns: 320px 1fr;
  overflow: hidden;
}
button, input, textarea, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- rail ---------- */
.rail {
  background: var(--rail);
  border-right: 1px solid var(--line);
  display: flex;
  flex-direction: column;
  min-height: 0;
}
.rail h1 {
  font: 600 1.05rem/1.2 var(--ui);
  margin: 0;
  padding: 18px 20px 12px;
}
.sheets { display: grid; gap: 2px; padding: 0 10px 12px; }
.sheet {
  text-align: left;
  border: 0;
  background: transparent;
  border-radius: 8px;
  padding: 10px 10px 11px;
  cursor: pointer;
  display: grid;
  gap: 6px;
}
.sheet:hover { background: color-mix(in srgb, var(--surface) 60%, transparent); }
.sheet[aria-current="true"] { background: var(--surface); }
.sheet-title { display: flex; justify-content: space-between; align-items: baseline; font-weight: 500; }
.sheet-count { color: var(--muted); font-size: .875rem; font-variant-numeric: tabular-nums; }
.bars { display: grid; gap: 4px; }
.bar { display: grid; grid-template-columns: 74px 1fr; align-items: center; gap: 8px; font-size: .78rem; color: var(--muted); }
.track { height: 4px; background: var(--faint); border-radius: 2px; overflow: hidden; }
.fill { display: block; height: 100%; background: var(--neel); width: 0; transition: width .3s ease; }

.tools { padding: 12px 20px 8px; border-top: 1px solid var(--line); display: grid; gap: 10px; }
.filters { display: flex; gap: 4px; flex-wrap: wrap; }
.filters button {
  border: 1px solid var(--line);
  background: transparent;
  border-radius: 999px;
  padding: 2px 11px;
  font-size: .875rem;
  cursor: pointer;
}
.filters button[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.search {
  width: 100%;
  border: 1px solid var(--line);
  background: var(--surface);
  border-radius: 8px;
  padding: 6px 10px;
}
.items { list-style: none; margin: 0; padding: 4px 10px 20px; overflow-y: auto; flex: 1; min-height: 0; }
.items li button {
  width: 100%;
  border: 0;
  background: transparent;
  text-align: left;
  border-radius: 6px;
  padding: 7px 10px;
  display: grid;
  grid-template-columns: 12px 1fr;
  gap: 2px 10px;
  cursor: pointer;
}
.items li button:hover { background: color-mix(in srgb, var(--surface) 60%, transparent); }
.items li button[aria-current="true"] { background: var(--surface); }
.items .meta { font-size: .78rem; color: var(--muted); grid-column: 2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.items .preview { grid-column: 2; font-size: .9rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.items .group { font-size: .78rem; color: var(--muted); padding: 12px 10px 2px; }
.dot { width: 9px; height: 9px; border-radius: 50%; border: 1.5px solid var(--faint); margin-top: 5px; grid-row: span 2; }
.dot.done { background: var(--done); border-color: var(--done); }
.dot.problem { background: var(--problem); border-color: var(--problem); }
.empty-list { color: var(--muted); padding: 16px 10px; font-size: .9rem; }

/* ---------- main ---------- */
main { overflow-y: auto; min-height: 0; display: flex; flex-direction: column; }
.page { flex: 1; width: 100%; max-width: 760px; margin: 0 auto; padding: 28px 32px 48px; }
.itemhead { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; color: var(--muted); font-size: .9rem; }
.itemhead .cat { color: var(--ink); font-weight: 500; }
.itemhead > span:last-child { white-space: nowrap; }
.source { margin: 18px 0 28px; }
.source .lang { font-size: .85rem; color: var(--muted); margin-bottom: 4px; }
.source .text {
  font: 400 1.55rem/1.6 var(--read);
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  margin: 0;
}
.source .text.secondary { font-size: 1.05rem; color: var(--muted); margin-top: 14px; }
.source .text.long { font-size: 1.2rem; line-height: 1.75; }
details.context {
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 10px 14px;
  margin: 0 0 24px;
  background: var(--surface);
}
details.context summary { cursor: pointer; color: var(--muted); font-size: .9rem; }
details.context .ctx { font: 400 1.02rem/1.7 var(--read); white-space: pre-wrap; margin: 10px 0 0; }
details.context .ctx + .lang { margin-top: 14px; }
details.context .lang { font-size: .8rem; color: var(--muted); margin-top: 10px; }

.field { margin-bottom: 22px; }
.field label { display: flex; justify-content: space-between; align-items: baseline; font-weight: 500; margin-bottom: 6px; }
.field .hint { font-weight: 400; font-size: .85rem; color: var(--muted); }
.field .hint.ok { color: var(--done); }
.field .hint.problem { color: var(--problem); }
.field textarea {
  width: 100%;
  min-height: 3.2em;
  resize: none;
  overflow: hidden;
  border: 1px solid var(--line);
  border-bottom: 2px solid var(--faint);
  border-radius: 8px 8px 4px 4px;
  background: var(--surface);
  padding: 10px 12px;
  font: 400 1.25rem/1.55 var(--read);
}
.field textarea:focus { border-bottom-color: var(--neel); outline: none; }
.field textarea:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--neel-soft); }
.field.is-problem textarea { border-bottom-color: var(--problem); background: var(--problem-soft); }
.field.notes textarea { font: 400 1rem/1.5 var(--ui); min-height: 2.4em; }
.check {
  display: inline-flex; align-items: center; gap: 10px;
  border: 1px solid var(--line); background: var(--surface);
  border-radius: 8px; padding: 8px 14px; cursor: pointer; font-weight: 500;
}
.check[aria-pressed="true"] { border-color: var(--done); color: var(--done); }
.check .box { width: 16px; height: 16px; border-radius: 4px; border: 1.5px solid currentColor; display: grid; place-items: center; font-size: 12px; line-height: 1; }

.actions {
  position: sticky; bottom: 0;
  background: color-mix(in srgb, var(--paper) 92%, transparent);
  backdrop-filter: blur(6px);
  border-top: 1px solid var(--line);
  padding: 12px 32px;
  display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
}
.actions .inner { max-width: 760px; margin: 0 auto; width: 100%; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.btn {
  border: 1px solid var(--line); background: var(--surface);
  border-radius: 8px; padding: 7px 14px; cursor: pointer;
}
.btn.primary { background: var(--neel); border-color: var(--neel); color: #fff; font-weight: 500; }
@media (prefers-color-scheme: dark) { .btn.primary { color: #10142a; } }
.btn:disabled { opacity: .45; cursor: default; }
kbd { font: inherit; font-size: .78rem; border: 1px solid currentColor; border-radius: 4px; padding: 0 4px; opacity: .75; margin-left: 6px; }
.saved { margin-left: auto; font-size: .875rem; color: var(--muted); }
.saved.error { color: var(--problem); }
.finished { text-align: center; padding: 80px 0; }
.finished p { font: 400 1.5rem/1.5 var(--read); margin: 0 0 8px; }
.finished span { color: var(--muted); }

.menu-btn { display: none; }

/* ---------- narrow screens ---------- */
@media (max-width: 820px) {
  body { grid-template-columns: 1fr; grid-template-rows: auto 1fr; overflow: hidden; }
  .rail { border-right: 0; border-bottom: 1px solid var(--line); }
  .rail h1 { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; }
  .menu-btn { display: inline-block; }
  .rail:not(.open) .sheets, .rail:not(.open) .tools, .rail:not(.open) .items { display: none; }
  .rail.open { position: fixed; inset: 0; z-index: 10; }
  .page { padding: 20px 16px 32px; }
  .actions { padding: 10px 16px; }
  .source .text { font-size: 1.3rem; }
  kbd { display: none; }
}
@media (prefers-reduced-motion: reduce) { .fill { transition: none; } }
</style>
</head>
<body>
<aside class="rail" id="rail">
  <h1><span>Translation workbench</span><button class="btn menu-btn" id="menuBtn" aria-expanded="false" aria-controls="rail">Items</button></h1>
  <nav class="sheets" id="sheets" aria-label="Worksheets"></nav>
  <div class="tools">
    <div class="filters" id="filters" role="group" aria-label="Show">
      <button data-filter="todo" aria-pressed="true">To do</button>
      <button data-filter="problem" aria-pressed="false">Problems</button>
      <button data-filter="done" aria-pressed="false">Done</button>
      <button data-filter="all" aria-pressed="false">All</button>
    </div>
    <label class="sr-only" for="search">Search items</label>
    <input class="search" id="search" type="search" placeholder="Search id or text">
  </div>
  <ol class="items" id="items" aria-label="Items"></ol>
</aside>

<main id="main">
  <div class="page" id="page"></div>
  <div class="actions">
    <div class="inner">
      <button class="btn" id="prevBtn">Previous<kbd>⌥↑</kbd></button>
      <button class="btn" id="nextBtn">Next<kbd>⌥↓</kbd></button>
      <button class="btn primary" id="nextTodoBtn">Next to do<kbd>⌘↵</kbd></button>
      <span class="saved" id="saved" role="status" aria-live="polite"></span>
    </div>
  </div>
</main>

<script>
const LABELS = {
  en: "English", hi: "Hindi", hi_Latn: "Hinglish", notes: "Notes", summary: "Summary", checked: "Checked",
};
const FIELD_LABELS = {
  hi: "Hindi (Devanagari)", hi_Latn: "Hinglish (romanized)", notes: "Notes", summary: "Summary",
};
const FIELD_ATTRS = {
  hi: { lang: "hi", spellcheck: "false" },
  hi_Latn: { lang: "hi-Latn", spellcheck: "false", autocapitalize: "off", autocorrect: "off" },
  summary: { lang: "en" },
  notes: { lang: "en" },
};
const KIND_LABELS = { passage: "Passage", question: "Question", answer: "Answer" };

const state = {
  sheets: [], sheet: null, rows: [], index: 0, filter: "todo", query: "", load: 0,
  pending: new Map(), timer: null, saving: 0, error: null,
};
const $ = (id) => document.getElementById(id);
const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
};

async function api(path, body) {
  const res = await fetch(path, body ? {
    method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body),
  } : undefined);
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || res.statusText);
  return data;
}

// ---------- saving ----------
function queueSave(field, value) {
  const row = state.rows[state.index];
  row[field] = value;
  state.pending.set(`${row.id}\u0000${field}`, { sheet: state.sheet, id: row.id, field, value });
  setSaved("Unsaved changes");
  clearTimeout(state.timer);
  state.timer = setTimeout(flush, 600);
}

async function flush() {
  clearTimeout(state.timer);
  const jobs = [...state.pending.values()];
  state.pending.clear();
  for (const job of jobs) {
    state.saving++;
    setSaved("Saving");
    try {
      const out = await api("/api/save", job);
      const row = state.rows.find((r) => r.id === job.id);
      if (row && job.sheet === state.sheet) row.status = out.status;
      const sheet = state.sheets.find((s) => s.name === job.sheet);
      if (sheet) sheet.progress = out.progress;
      state.error = null;
      if (row && job.sheet === state.sheet && row === state.rows[state.index]) renderHints();
    } catch (e) {
      state.error = e.message;
      state.pending.set(`${job.id}\u0000${job.field}`, job); // keep it; retry on next flush
    } finally {
      state.saving--;
    }
  }
  // Update in place: rebuilding these lists during a blur (which triggers this flush) would
  // swap the button under the pointer between mousedown and mouseup and swallow the click.
  renderSheets();
  refreshItemStates();
  if (state.error) {
    setSaved(`Not saved: ${state.error}. Retrying`, true);
    state.timer = setTimeout(flush, 3000);
  } else if (!state.saving && !state.pending.size) {
    setSaved("All changes saved");
  }
}

function setSaved(text, error = false) {
  const el = $("saved");
  el.textContent = text;
  el.classList.toggle("error", error);
}

// ---------- data ----------
async function loadSheets() {
  state.sheets = await api("/api/sheets");
  renderSheets();
}

async function openSheet(name, focusId) {
  const token = ++state.load; // the latest click wins if loads overlap
  await flush();
  const data = await api(`/api/sheet/${name}`);
  if (token !== state.load) return;
  state.sheet = name;
  store.set("sheet", name);
  state.rows = data.rows;
  const sheet = state.sheets.find((s) => s.name === name);
  sheet.progress = data.progress;
  const wanted = focusId ?? store.get(`item:${name}`);
  let i = state.rows.findIndex((r) => r.id === wanted);
  if (i < 0) i = state.rows.findIndex((r) => r.status.state !== "done");
  state.index = Math.max(0, i);
  renderSheets();
  renderItems();
  renderItem();
}

function currentSheet() { return state.sheets.find((s) => s.name === state.sheet); }

function visible(row, i) {
  if (i === state.index) return true; // never hide the item being edited
  const f = state.filter;
  if (f !== "all" && row.status.state !== f) return false;
  if (!state.query) return true;
  const q = state.query.toLowerCase();
  return [row.id, row.en, row.hi, row.hi_Latn, row.summary, row.category]
    .some((v) => (v || "").toLowerCase().includes(q));
}

async function go(i, focus = true) {
  if (i < 0 || i >= state.rows.length) return;
  await flush();
  state.index = i;
  store.set(`item:${state.sheet}`, state.rows[i].id);
  renderItems();
  renderItem(focus);
  closeMenu();
}

function nextTodo() {
  const n = state.rows.length;
  for (let k = 1; k <= n; k++) {
    const j = (state.index + k) % n;
    if (state.rows[j].status.state !== "done") return j;
  }
  return -1;
}

// ---------- rendering ----------
function renderSheets() {
  const nav = $("sheets");
  if (nav.children.length !== state.sheets.length) {
    nav.replaceChildren(...state.sheets.map((s) => {
      const b = document.createElement("button");
      b.className = "sheet";
      b.dataset.sheet = s.name;
      b.addEventListener("click", () => openSheet(s.name));
      const title = el("span", "sheet-title");
      title.append(el("span", "", s.title), el("span", "sheet-count"));
      const bars = el("span", "bars");
      for (const f of s.required) {
        const bar = el("span", "bar");
        bar.dataset.field = f;
        const track = el("span", "track");
        track.append(el("span", "fill"));
        bar.append(el("span", "", LABELS[f]), track);
        bars.append(bar);
      }
      b.append(title, bars);
      return b;
    }));
  }
  for (const s of state.sheets) {
    const b = nav.querySelector(`[data-sheet="${s.name}"]`);
    b.setAttribute("aria-current", String(s.name === state.sheet));
    b.querySelector(".sheet-count").textContent = `${s.progress.done} of ${s.progress.total} done`;
    for (const bar of b.querySelectorAll(".bar")) {
      const n = s.progress.fields[bar.dataset.field];
      bar.querySelector(".fill").style.width = `${(100 * n) / s.progress.total}%`;
      bar.title = `${LABELS[bar.dataset.field]}: ${n} of ${s.progress.total}`;
    }
  }
}

function refreshItemStates() {
  for (const b of $("items").querySelectorAll("button[data-index]")) {
    const row = state.rows[Number(b.dataset.index)];
    if (!row) continue;
    b.querySelector(".dot").className = `dot ${row.status.state}`;
    b.querySelector(".preview").textContent = preview(row);
  }
}

function preview(row) {
  if (state.sheet === "generation") return row.hi_Latn || row.hi;
  if (state.sheet === "probe") return row.summary;
  return row.en;
}

function renderItems() {
  const list = $("items");
  const nodes = [];
  let lastGroup = null;
  state.rows.forEach((row, i) => {
    if (!visible(row, i)) return;
    if (state.sheet === "generation" && row.passage_id !== lastGroup) {
      lastGroup = row.passage_id;
      const g = document.createElement("li");
      g.className = "group";
      g.textContent = `Passage ${row.passage_id.replace("xq-p", "")}`;
      nodes.push(g);
    }
    const li = document.createElement("li");
    const b = document.createElement("button");
    b.setAttribute("aria-current", String(i === state.index));
    b.dataset.index = i;
    b.innerHTML = `<span class="dot"></span><span class="meta"></span><span class="preview"></span>`;
    b.querySelector(".dot").classList.add(row.status.state);
    b.querySelector(".meta").textContent =
      state.sheet === "generation" ? KIND_LABELS[row.category] : `${row.id}, ${row.category}`;
    b.querySelector(".preview").textContent = preview(row);
    b.addEventListener("click", () => go(i));
    li.append(b);
    nodes.push(li);
  });
  if (!nodes.length) {
    const li = document.createElement("li");
    li.className = "empty-list";
    li.textContent = state.filter === "todo" ? "Nothing left to do in this worksheet." :
      state.filter === "problem" ? "No problems found." : "No items match.";
    nodes.push(li);
  }
  list.replaceChildren(...nodes);
  list.querySelector('[aria-current="true"]')?.scrollIntoView({ block: "nearest" });
}

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}

function renderItem(focus = true) {
  const page = $("page");
  const row = state.rows[state.index];
  const sheet = currentSheet();
  if (!row) { page.replaceChildren(el("p", "empty-list", "This worksheet is empty.")); return; }

  const head = el("div", "itemhead");
  const left = el("span");
  const kind = state.sheet === "generation" ? KIND_LABELS[row.category] : row.category;
  left.append(el("span", "cat", kind), document.createTextNode(`  ${row.id}`));
  head.append(left, el("span", "", `${state.index + 1} of ${state.rows.length}`));

  const source = el("section", "source");
  if (state.sheet === "generation") {
    source.append(el("div", "lang", "Hindi"));
    const t = el("p", "text", row.hi);
    t.lang = "hi";
    if (row.category === "passage") t.classList.add("long");
    source.append(t);
    const en = el("p", "text secondary", row.en);
    en.lang = "en";
    source.append(en);
  } else {
    source.append(el("div", "lang", "English"));
    const t = el("p", "text", row.en);
    t.lang = "en";
    source.append(t);
  }

  const parts = [head, source];
  if (state.sheet === "generation" && row.category !== "passage") {
    const p = state.rows.find((r) => r.id === row.passage_id);
    if (p) {
      const d = el("details", "context");
      d.open = store.get("contextOpen") === "1";
      d.addEventListener("toggle", () => store.set("contextOpen", d.open ? "1" : "0"));
      d.append(el("summary", "", "Show the passage"));
      d.append(el("div", "lang", "Hindi"));
      const hi = el("p", "ctx", p.hi); hi.lang = "hi";
      d.append(hi);
      d.append(el("div", "lang", "Your Hinglish"));
      const hl = el("p", "ctx", p.hi_Latn || "Not romanized yet.");
      d.append(hl);
      parts.push(d);
    }
  }

  const form = el("section", "fields");
  for (const f of sheet.fields) {
    if (f === "checked") {
      const b = el("button", "check");
      const on = ["y", "yes"].includes((row.checked || "").trim().toLowerCase());
      b.setAttribute("aria-pressed", String(on));
      b.dataset.field = "checked";
      b.innerHTML = `<span class="box" aria-hidden="true"></span><span></span>`;
      b.querySelector(".box").textContent = on ? "✓" : "";
      b.lastChild.textContent = on ? "Summary checked" : "Mark summary as checked";
      b.addEventListener("click", () => {
        const now = b.getAttribute("aria-pressed") !== "true";
        queueSave("checked", now ? "y" : "");
        renderItem(false);
      });
      const wrap = el("div", "field");
      wrap.append(b);
      form.append(wrap);
      continue;
    }
    const wrap = el("div", `field${f === "notes" ? " notes" : ""}`);
    wrap.dataset.field = f;
    const id = `f-${f}`;
    const label = el("label");
    label.htmlFor = id;
    label.append(el("span", "", FIELD_LABELS[f]), el("span", "hint"));
    const ta = el("textarea");
    ta.id = id;
    ta.value = row[f] || "";
    ta.rows = 1;
    for (const [k, v] of Object.entries(FIELD_ATTRS[f] || {})) ta.setAttribute(k, v);
    ta.addEventListener("input", () => { grow(ta); queueSave(f, ta.value); });
    ta.addEventListener("blur", () => flush());
    wrap.append(label, ta);
    form.append(wrap);
  }
  parts.push(form);
  page.replaceChildren(...parts);
  page.querySelectorAll("textarea").forEach(grow);
  renderHints();
  $("prevBtn").disabled = state.index === 0;
  $("nextBtn").disabled = state.index === state.rows.length - 1;
  $("main").scrollTop = 0;
  if (focus) {
    const first = sheet.required.find((f) => f !== "checked" && !(row[f] || "").trim());
    (first ? $(`f-${first}`) : page.querySelector("textarea"))?.focus({ preventScroll: true });
  }
}

function renderHints() {
  const row = state.rows[state.index];
  const sheet = currentSheet();
  for (const f of sheet.required) {
    const wrap = document.querySelector(`.field[data-field="${f}"]`);
    if (!wrap) continue;
    const hint = wrap.querySelector(".hint");
    const problem = row.status.problems[f];
    const missing = row.status.missing.includes(f);
    wrap.classList.toggle("is-problem", Boolean(problem));
    hint.className = `hint ${problem ? "problem" : missing ? "" : "ok"}`;
    hint.textContent = problem ? fixText(problem) : missing ? "Required" : "Looks right";
  }
}

function fixText(problem) {
  if (problem.startsWith("hi should")) return "Use Devanagari for Hindi";
  if (problem.startsWith("hi-Latn")) return "Use Latin letters only";
  return problem;
}

function grow(ta) { ta.style.height = "auto"; ta.style.height = `${ta.scrollHeight + 2}px`; }

function closeMenu() {
  $("rail").classList.remove("open");
  $("menuBtn").setAttribute("aria-expanded", "false");
  $("menuBtn").textContent = "Items";
}

// ---------- events ----------
$("filters").addEventListener("click", (e) => {
  const b = e.target.closest("button");
  if (!b) return;
  state.filter = b.dataset.filter;
  store.set("filter", state.filter);
  for (const x of $("filters").children) x.setAttribute("aria-pressed", String(x === b));
  renderItems();
});
$("search").addEventListener("input", (e) => { state.query = e.target.value.trim(); renderItems(); });
$("prevBtn").addEventListener("click", () => go(state.index - 1));
$("nextBtn").addEventListener("click", () => go(state.index + 1));
$("nextTodoBtn").addEventListener("click", async () => {
  await flush();
  const j = nextTodo();
  if (j >= 0 && j !== state.index) go(j);
  else if (j < 0) showFinished();
});
$("menuBtn").addEventListener("click", () => {
  const open = !$("rail").classList.contains("open");
  $("rail").classList.toggle("open", open);
  $("menuBtn").setAttribute("aria-expanded", String(open));
  $("menuBtn").textContent = open ? "Close" : "Items";
});
document.addEventListener("keydown", (e) => {
  if ((e.metaKey || e.ctrlKey) && e.key === "Enter") { e.preventDefault(); $("nextTodoBtn").click(); }
  else if (e.altKey && e.key === "ArrowDown") { e.preventDefault(); go(state.index + 1); }
  else if (e.altKey && e.key === "ArrowUp") { e.preventDefault(); go(state.index - 1); }
});
window.addEventListener("beforeunload", (e) => {
  if (state.pending.size) { flush(); e.preventDefault(); }
});

function showFinished() {
  const s = currentSheet();
  const wrap = el("div", "finished");
  wrap.append(el("p", "", `${s.title} is complete.`));
  wrap.append(el("span", "", "Run uv run python data/freeze.py to freeze it, then data/backup.py push."));
  $("page").replaceChildren(wrap);
}

(async () => {
  const f = store.get("filter");
  if (f) {
    state.filter = f;
    for (const x of $("filters").children) x.setAttribute("aria-pressed", String(x.dataset.filter === f));
  }
  try {
    await loadSheets();
    const saved = store.get("sheet");
    const first = state.sheets.find((s) => s.name === saved) ? saved : state.sheets[0]?.name;
    if (first) await openSheet(first);
    setSaved("All changes saved");
  } catch (e) {
    $("page").replaceChildren(el("p", "empty-list", `Couldn't load the worksheets: ${e.message}. Is translate_app.py running?`));
  }
})();
</script>
</body>
</html>
