# GGUF builds. All produced with llama.cpp from third_party/llama.cpp at a recorded commit,
# except community_q4 (downloaded; see models.yaml). BF16 is the reference for relative loss.
precisions:
  BF16:
    source: convert          # convert_hf_to_gguf.py --outtype bf16
    reference: true
  Q8_0:
    source: quantize         # llama-quantize <bf16.gguf> <out.gguf> Q8_0
  Q6_K:
    source: quantize
  Q4_K_M:
    source: quantize
  Q3_K_M:
    source: quantize
  community_q4:
    source: download         # repo/file/sha256 per model in models.yaml

# H4 (Milestone 7): imatrix-recalibrated builds, 4 models x 2 = 8 extra builds.
recalibrated:
  base_precisions: [Q4_K_M, Q3_K_M]
  imatrix_variants:
    multilingual_safety:
      calibration_data: TODO   # multilingual + safety calibration text; record its sha256
