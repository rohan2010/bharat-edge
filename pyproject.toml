[project]
name = "bharatedge-eval"
version = "0.1.0"
description = "Does GGUF quantization of sub-2B models hurt Indic languages (Hindi, Hinglish, Bengali/Tamil) more than English?"
readme = "README.md"
requires-python = "==3.11.*"
dependencies = [
    "llama-cpp-python",
    "huggingface_hub",
    "pyyaml",
    "duckdb",
    "numpy",
    "scipy",
    "pandas",
    "matplotlib",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bee"]

[tool.uv]
# llama-cpp-python is built from source; it must be built with Metal:
#   CMAKE_ARGS="-DGGML_METAL=on" uv sync
# Rebuild after changing flags:
#   CMAKE_ARGS="-DGGML_METAL=on" uv sync --reinstall-package llama-cpp-python
no-binary-package = ["llama-cpp-python"]
# Use uv's own Python, not python.org's: python.org 3.11 is linked against the
# macOS 12.1 SDK, so Metal compiles shaders below language 3.1 and llama.cpp
# drops every BF16 kernel ("kernel not found ... bf16"), crashing BF16 GGUFs.
python-preference = "only-managed"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["third_party", "models", "docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY"]
